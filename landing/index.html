@import url("${Iv}");
.palace-grid{font-family:'Plus Jakarta Sans',sans-serif;color:#E5E8F0;color-scheme:dark;background-color:#0A0B0E;background-image:linear-gradient(#161822 1px,transparent 1px),linear-gradient(90deg,#161822 1px,transparent 1px);background-size:32px 32px;min-height:100vh;isolation:isolate}
.palace-grid *{box-sizing:border-box}
.palace-grid button,.palace-grid select{cursor:pointer}
.palace-grid button:disabled{cursor:default}
.palace-grid .pg-heading,.palace-grid .pg-display,.palace-grid .pg-zone-label{font-family:'Space Grotesk',sans-serif}
.palace-grid .pg-mono{font-family:'JetBrains Mono',monospace}
.palace-grid .pg-display{font-weight:700;letter-spacing:-2.5px;line-height:.98}
.palace-grid .pg-zone-label{font-weight:700;font-size:14px;letter-spacing:-.6px;line-height:1.3}
.palace-grid .pg-focus:focus-visible{outline:2px solid #E0FCFF;outline-offset:4px}
.palace-grid .pg-nav-link{transition:color .2s}
.palace-grid .pg-nav-link:hover{color:#fff}
.palace-grid .pg-press{transition:transform .15s,box-shadow .15s,filter .15s}
.palace-grid .pg-press:hover:not(:disabled){filter:brightness(1.1)}
.palace-grid .pg-press:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.palace-grid .pg-fine-grid{background-image:linear-gradient(#29313C66 1px,transparent 1px),linear-gradient(90deg,#29313C66 1px,transparent 1px);background-size:18px 18px}
.palace-grid .pg-chart-grid{background-image:linear-gradient(#6B71841A 1px,transparent 1px);background-size:100% 15px}
.palace-grid .pg-radar-grid{background-image:linear-gradient(#2D683633 1px,transparent 1px),linear-gradient(90deg,#2D683633 1px,transparent 1px);background-size:12px 12px}
.palace-grid .pg-radar-sweep{background:conic-gradient(from 0deg,transparent 0deg,transparent 270deg,#2EE56B18 330deg,#2EE56B33 359deg,transparent 360deg);animation:pg-radar 7s linear infinite}
.palace-grid .pg-ping{animation:pg-ping 2.5s ease-out infinite}
.palace-grid .pg-status{animation:pg-status 3s ease-in-out infinite}
.palace-grid .pg-load-bar{animation:pg-load 2s ease-in-out infinite alternate}
.palace-grid .pg-flow-line{animation:pg-flow 2s linear infinite}
.palace-grid .pg-robot-bob{animation:pg-bob 3s ease-in-out infinite;image-rendering:pixelated}
.palace-grid .pg-cursor{animation:pg-blink 1.2s step-end infinite}
.palace-grid .pg-terminal-scroll{scrollbar-width:thin;scrollbar-color:#3D6750 #0A1211}
@keyframes pg-radar{to{transform:rotate(360deg)}}
@keyframes pg-ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes pg-status{50%{opacity:.5}}
